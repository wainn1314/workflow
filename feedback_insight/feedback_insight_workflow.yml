app:
  description: 自动完成用户反馈的语义聚类、KANO分类与优先级排序，生成结构化需求报告
  icon: 🤖
  icon_background: '#FFEAD5'
  icon_type: emoji
  mode: workflow
  name: 用户反馈需求洞察
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/tongyi:0.2.15@1df8bd27d67c149e6db3c210830ef6e3857c5a9df5e8edbe9e785b995f337ef5
    version: null
kind: app
version: '0.7.0'
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions:
      - .JPG
      - .JPEG
      - .PNG
      - .GIF
      - .WEBP
      - .SVG
      allowed_file_types:
      - image
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: false
      fileUploadConfig:
        attachment_image_file_size_limit: 2
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        file_upload_limit: 50
        image_file_batch_limit: 10
        image_file_size_limit: 10
        knowledge_file_size_limit: 15
        single_chunk_attachment_limit: 10
        skill_file_size_limit: 50
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: ''
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: llm
      id: start-source-semantic_cluster-target
      selected: false
      source: start
      sourceHandle: source
      target: semantic_cluster
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: llm
        targetType: code
      id: semantic_cluster-source-validate_json-target
      selected: false
      source: semantic_cluster
      sourceHandle: source
      target: validate_json
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: code
        targetType: if-else
      id: validate_json-source-check_valid-target
      selected: false
      source: validate_json
      sourceHandle: source
      target: check_valid
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: if-else
        targetType: llm
      id: check_valid-true-requirement_refine-target
      selected: false
      source: check_valid
      sourceHandle: 'true'
      target: requirement_refine
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: if-else
        targetType: end
      id: check_valid-false-end-target
      selected: false
      source: check_valid
      sourceHandle: 'false'
      target: end
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: llm
        targetType: end
      id: requirement_refine-source-end-target
      selected: false
      source: requirement_refine
      sourceHandle: source
      target: end
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        selected: false
        title: 开始
        type: start
        variables:
        - default: ''
          hint: ''
          label: 用户反馈原始数据
          max_length: 10000
          options: []
          placeholder: 支持批量粘贴多条反馈内容
          required: true
          type: paragraph
          variable: feedback_data
      height: 114
      id: start
      position:
        x: 80
        y: 282
      positionAbsolute:
        x: 80
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
      zIndex: 0
    - data:
        context:
          enabled: false
          variable_selector: []
        desc: 语义聚类
        model:
          completion_params:
            temperature: 0.7
          mode: chat
          name: qwen-max
          provider: langgenius/tongyi/tongyi
        prompt_template:
        - id: a1b2c3d4-e5f6-7890-ab12-cd34ef560001
          role: system
          text: "你是一位资深用户研究员。请对以下用户反馈数据进行：1. 去重合并语义相似反馈 2. 情感标注（正面/中性/负面）3. 主题聚类（不超过15个）4. 频率统计。\n\
            \n请直接输出合法JSON，不要包含任何其他文字、markdown标记或代码块，格式如下：\n{\"themes\":[{\"theme_name\"\
            :\"\",\"count\":0,\"sentiment_ratio\":{\"positive\":0,\"neutral\":0,\"\
            negative\":0},\"representative_quotes\":[]}]}\n注意：theme_name必须根据实际数据提炼具体中文主题，count必须为数字类型，sentiment_ratio必须为对象类型，representative_quotes必须为字符串数组，quotes必须引用原始反馈中的真实原话。"
        - id: a1b2c3d4-e5f6-7890-ab12-cd34ef560002
          role: user
          text: "用户反馈数据：\n{{#start.feedback_data#}}"
        selected: false
        title: 语义聚类
        type: llm
        vision:
          enabled: false
      height: 115
      id: semantic_cluster
      position:
        x: 382
        y: 282
      positionAbsolute:
        x: 382
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
      zIndex: 0
    - data:
        code: "import json\nimport re\n\ndef main(cluster_result: str) -> dict:\n\
          \    try:\n        cleaned_str = re.sub(r'^```json\\s*', '', cluster_result,\
          \ flags=re.MULTILINE)\n        cleaned_str = re.sub(r'^```\\s*', '', cleaned_str,\
          \ flags=re.MULTILINE)\n        cleaned_str = cleaned_str.strip()\n     \
          \   \n        if not cleaned_str or re.match(r'^[\\u4e00-\\u9fa5\\w\\s\\\
          .,!?，。！？]+$', cleaned_str):\n            err = f\"模型未输出JSON，原始输出: {cleaned_str[:100]}\"\
          \n            return {\"is_valid\": False, \"valid_data\": err, \"error\"\
          : err}\n        \n        data = json.loads(cleaned_str)\n        \n   \
          \     if \"themes\" not in data or not isinstance(data[\"themes\"], list)\
          \ or len(data[\"themes\"]) == 0:\n            err = \"未识别到有效主题或themes字段缺失\"\
          \n            return {\"is_valid\": False, \"valid_data\": err, \"error\"\
          : err}\n            \n        return {\"is_valid\": True, \"valid_data\"\
          : cleaned_str, \"error\": \"\"}\n        \n    except json.JSONDecodeError\
          \ as e:\n        err = f\"输出不是合法JSON，解析错误: {str(e)}，原始输出前100字符: {cluster_result[:100]}\"\
          \n        return {\"is_valid\": False, \"valid_data\": err, \"error\": err}\n\
          \    except Exception as e:\n        err = f\"未知错误: {str(e)}\"\n       \
          \ return {\"is_valid\": False, \"valid_data\": err, \"error\": err}"
        code_language: python3
        desc: JSON校验
        outputs:
          error:
            children: null
            type: string
          is_valid:
            children: null
            type: boolean
          valid_data:
            children: null
            type: string
        selected: false
        title: JSON校验
        type: code
        variables:
        - value_selector:
          - semantic_cluster
          - text
          value_type: string
          variable: cluster_result
      height: 79
      id: validate_json
      position:
        x: 684
        y: 282
      positionAbsolute:
        x: 684
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
      zIndex: 0
    - data:
        cases:
        - case_id: 'true'
          conditions:
          - comparison_operator: is
            id: b2c3d4e5-f6a7-8901-bc23-de45f6670001
            value: true
            varType: boolean
            variable_selector:
            - validate_json
            - is_valid
          id: 'true'
          logical_operator: and
        selected: false
        title: 校验判断
        type: if-else
      height: 123
      id: check_valid
      position:
        x: 986
        y: 282
      positionAbsolute:
        x: 986
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
      zIndex: 0
    - data:
        context:
          enabled: false
          variable_selector: []
        desc: 需求提炼
        model:
          completion_params:
            temperature: 0.7
          mode: chat
          name: qwen-max
          provider: langgenius/tongyi/tongyi
        prompt_template:
        - id: c3d4e5f6-a7b8-9012-cd34-ef5678780001
          role: system
          text: "你是一位资深产品需求分析师。请基于以下用户反馈聚类结果，完成以下分析：\n1. 按KANO模型将每个主题分类为：必备型需求/期望型需求/兴奋型需求/无差异需求/反向型需求\n\
            2. 提炼每个主题对应的产品优化建议，按优先级排序\n3. 总结整体用户反馈的核心痛点和高频需求\n请直接输出合法JSON，不要包含任何其他文字，格式如下：\n\
            {\"kano_classification\":[{\"theme_name\":\"\",\"category\":\"\",\"priority\"\
            :0,\"suggestion\":\"\"}],\"core_pain_points\":[],\"high_frequency_needs\"\
            :[]}\n注意：priority为1-5的数字，1为最高优先级，suggestion必须具体可落地。"
        - id: c3d4e5f6-a7b8-9012-cd34-ef5678780002
          role: user
          text: "用户反馈聚类结果：\n{{#validate_json.valid_data#}}"
        selected: false
        title: 需求提炼
        type: llm
        vision:
          enabled: false
      height: 115
      id: requirement_refine
      position:
        x: 1288
        y: 400
      positionAbsolute:
        x: 1288
        y: 400
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
      zIndex: 0
    - data:
        outputs:
        - value_selector:
          - validate_json
          - valid_data
          value_type: string
          variable: cluster_result
        - value_selector:
          - requirement_refine
          - text
          value_type: string
          variable: insight_result
        selected: false
        title: 结束
        type: end
      height: 112
      id: end
      position:
        x: 1590
        y: 282
      positionAbsolute:
        x: 1590
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
      zIndex: 0
    viewport:
      x: -29
      y: 77.5
      zoom: 1
  rag_pipeline_variables: []
