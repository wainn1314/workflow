            请直接输出合法JSON，不要包含任何其他文字、markdown标记或代码块，格式如下：

            {"themes":[{"theme_name":"","count":0,"sentiment_ratio":{"positive":0,"neutral":0,"negative":0},"representative_quotes":[]}]}


            注意：theme_name必须根据实际数据提炼具体中文主题，quotes必须引用原始反馈中的真实原话。'
