    - data:
        code: "import json\nimport re\n\ndef main(cluster_result: str) -> dict:\n\
          \    try:\n        # 1. 清洗可能存在的 Markdown 标签\n        cleaned_str = re.sub(r'^```json\\\
          s*', '', cluster_result, flags=re.MULTILINE)\n        cleaned_str = re.sub(r'^```\\\
          s*', '', cleaned_str, flags=re.MULTILINE)\n        cleaned_str = cleaned_str.strip()\n\
          \        \n        # 2. 检查是否为空或纯中文字符\n        if not cleaned_str or re.match(r'^[\\\
          u4e00-\\u9fa5\\w\\s\\.,!?，。！？]+$', cleaned_str):\n            return {\"\
          is_valid\": False, \"valid_data\": \"\", \"error\": f\"模型未输出JSON，原始输出: {cleaned_str[:100]}\"\
          }\n        \n        # 3. 解析 JSON\n        data = json.loads(cleaned_str)\n\
          \        \n        # 4. 结构校验\n        if \"themes\" not in data or not isinstance(data[\"\
          themes\"], list) or len(data[\"themes\"]) == 0:\n            return {\"\
          is_valid\": False, \"valid_data\": \"\", \"error\": \"未识别到有效主题或themes字段缺失\"\
          }\n            \n        return {\"is_valid\": True, \"valid_data\": cleaned_str,\
          \ \"error\": \"\"}\n        \n    except json.JSONDecodeError as e:\n  \
          \      return {\"is_valid\": False, \"valid_data\": \"\", \"error\": f\"\
          输出不是合法JSON，解析错误: {str(e)}，原始输出前100字符: {cluster_result[:100]}\"}\n    except\
          \ Exception as e:\n        return {\"is_valid\": False, \"valid_data\":\
          \ \"\", \"error\": f\"未知错误: {str(e)}\"}"
        code_language: python3
