    - data:
        code: "import json\n\ndef main(data) -> dict:\n    raw = None\n    if isinstance(data, dict):\n        raw = data.get('urls', data.get('url', []))\n    elif isinstance(data, str):\n        try:\n            obj = json.loads(data)\n            raw = obj.get('urls', obj.get('url', [])) if isinstance(obj, dict) else obj\n        except Exception:\n            raw = [data]\n    if not isinstance(raw, list):\n        raw = [raw] if raw else []\n    cleaned = []\n    seen = set()\n    for u in raw:\n        s = str(u).strip()\n        while s and s[0] in (chr(34), chr(39)) and s[-1] in (chr(34), chr(39)):\n            s = s[1:-1].strip()\n        if s.startswith(('http://', 'https://')) and s not in seen:\n            seen.add(s)\n            cleaned.append(s)\n    return {'url_list': cleaned}\n"
