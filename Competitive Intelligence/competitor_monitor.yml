    - data:
        code: "import re\n\ndef main(html_content: str) -> dict:\n    text = html_content\
          \ or \"\"\n    text = re.sub(r\"(?is)<script[^>]*>.*?</script>\", \" \",\
          \ text)\n    text = re.sub(r\"(?is)<style[^>]*>.*?</style>\", \" \", text)\n\
          \    text = re.sub(r\"(?is)<noscript[^>]*>.*?</noscript>\", \" \", text)\n\
          \    text = re.sub(r\"(?i)<!--.*?-->\", \" \", text)\n    text = re.sub(r\"\
          <[^>]+>\", \" \", text)\n    text = re.sub(r\"(?i)(cookie|privacy policy|隐私政策|隐私声明|cookie\
          \ settings).{0,80}\", \" \", text)\n    text = re.sub(r\"&nbsp;|&amp;|&lt;|&gt;|&quot;|&#\\d+;\"\
          , \" \", text)\n    text = re.sub(r\"\\s+\", \" \", text).strip()\n    if\
          \ len(text) > 20000:\n        text = text[:20000]\n    return {\"cleaned_text\"\
          : text}\n"
        code_language: python3
        desc: 去除 script/style/HTML 标签与无关文本
