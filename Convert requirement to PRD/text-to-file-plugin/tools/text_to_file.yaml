identity:
  name: text_to_file
  author: prd
  label:
    en_US: Text to File
    zh_Hans: 文本转文件
description:
  human:
    en_US: Convert text content into a downloadable file (e.g. Markdown PRD).
    zh_Hans: 将文本内容转换为可下载的文件（例如 Markdown PRD 文档）。
  llm: Convert text content into a downloadable file.
parameters:
  - name: text
    type: string
    required: true
    label:
      en_US: Text Content
      zh_Hans: 文本内容
    human_description:
      en_US: The full text content to save into the file.
      zh_Hans: 要保存为文件的完整文本内容。
    llm_description: The full text content to save into the file.
    form: llm
  - name: filename
    type: string
    required: false
    label:
      en_US: Filename
      zh_Hans: 文件名
    human_description:
      en_US: Output filename. Defaults to PRD.md. The .md extension is appended automatically if missing.
      zh_Hans: 输出文件名，默认为 PRD.md。缺少 .md 后缀时会自动补全。
    llm_description: Output filename.
    form: form
extra:
  python:
    source: tools/text_to_file.py
