app:
  description: 根据输入的功能需求信息，自动完成需求深度拆解、边界条件补全、PRD 生成、自检校对与终稿输出，最终产出高质量的 PRD 文档。
  icon: 🤖
  icon_background: '#FFEAD5'
  icon_type: emoji
  mode: workflow
  name: 需求PRD自动生成工作流
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.7.0
workflow:
  conversation_variables: []
  environment_variables: []
  rag_pipeline_variables: []
  features:
    file_upload:
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
          - local_file
          - remote_url
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
      - data:
          isInLoop: false
          sourceType: start
          targetType: llm
        id: start-source-llm_decompose-target
        source: start
        sourceHandle: source
        target: llm_decompose
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInLoop: false
          sourceType: llm
          targetType: llm
        id: llm_decompose-source-llm_boundary-target
        source: llm_decompose
        sourceHandle: source
        target: llm_boundary
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInLoop: false
          sourceType: llm
          targetType: llm
        id: llm_boundary-source-llm_prd_generate-target
        source: llm_boundary
        sourceHandle: source
        target: llm_prd_generate
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInLoop: false
          sourceType: llm
          targetType: llm
        id: llm_prd_generate-source-llm_self_check-target
        source: llm_prd_generate
        sourceHandle: source
        target: llm_self_check
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInLoop: false
          sourceType: llm
          targetType: llm
        id: llm_self_check-source-llm_final-target
        source: llm_self_check
        sourceHandle: source
        target: llm_final
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInLoop: false
          sourceType: llm
          targetType: tool
        id: llm_final-source-tool_text_to_file-target
        source: llm_final
        sourceHandle: source
        target: tool_text_to_file
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInLoop: false
          sourceType: tool
          targetType: end
        id: tool_text_to_file-source-end-target
        source: tool_text_to_file
        sourceHandle: source
        target: end
        targetHandle: target
        type: custom
        zIndex: 0
    nodes:
      - data:
          desc: ''
          selected: false
          title: 开始
          type: start
          version: '1'
          variables:
            - label: 功能名称
              max_length: 256
              options: []
              required: true
              type: text-input
              variable: feature_name
            - label: 用户场景描述
              options: []
              required: true
              type: paragraph
              variable: user_scenario
            - label: 核心痛点
              options: []
              required: true
              type: paragraph
              variable: core_pain_point
            - label: MVP范围
              options: []
              required: true
              type: paragraph
              variable: mvp_scope
            - label: 非功能要求
              options: []
              required: true
              type: paragraph
              variable: non_functional_requirements
        height: 274
        id: start
        position:
          x: 0
          y: 0
        positionAbsolute:
          x: 0
          y: 0
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          context:
            enabled: false
            variable_selector: []
          desc: ''
          memory: null
          model:
            completion_params:
              max_tokens: 4096
              temperature: 0.3
            mode: chat
            name: qwen-plus
            provider: tongyi
          prompt_template:
            - role: user
              text: |
                你是一位资深B端产品经理。

                【第一步：输入清晰度校验（必须最先执行）】
                先判断用户输入是否清晰、具体、完整，足以支撑生成一份合格的PRD。
                以下任一情况都视为"输入模糊"，必须判定为不合格：
                - 功能名称笼统、口号化（例如"用AI帮人工作""做个智能系统""提升效率"等，没有说清具体做什么、给谁用、解决什么具体问题）
                - 用户场景、核心痛点、MVP范围三项中有任意一项为空、过短或含糊
                - 整段输入没有可落地的具体功能点

                如果判定为"输入模糊"，立即停止，只输出下面这段固定提示（一字不差），不要输出任何其他内容：
                ⚠️ 输入信息模糊，无法生成PRD。请补充以下信息后重新输入：
                1. 功能名称：这个功能具体做什么？面向哪些用户？（避免笼统口号）
                2. 用户场景：谁在什么情况下使用？要完成什么具体任务？
                3. 核心痛点：现状存在什么具体问题？带来了什么损失？
                4. MVP范围：第一版具体包含哪些功能点？
                5. 非功能要求：性能/安全/合规等要求（如无特殊要求可写"无"）

                【抗幻觉铁律（最高优先级）】
                1. 只能使用用户输入中明确出现的信息，严禁编造、推测或脑补。
                2. 禁止凭空生成任何具体数据（数字、百分比、金额、成本、用户量、市场份额、竞品名称等）。
                3. 输入中未提供的细节一律标【待补充】，不得伪造数值。

                【第二步：仅当输入清晰时才继续】
                请将以下需求拆解为完整的业务逻辑结构：

                【功能名称】{{#start.feature_name#}}
                【用户场景】{{#start.user_scenario#}}
                【核心痛点】{{#start.core_pain_point#}}
                【MVP范围】{{#start.mvp_scope#}}
                【非功能要求】{{#start.non_functional_requirements#}}

                请从以下维度逐层拆解（只基于上述输入，不得补充输入中没有的信息）：
                1. 角色与权限：涉及哪些角色？每个角色的数据范围和操作权限？
                2. 主流程：正常情况下的完整操作路径
                3. 分支流程：不同条件下的分流逻辑
                4. 异常场景：空状态、网络异常、数据不存在、权限不足等
                5. 状态流转：核心实体的状态机（如订单状态：待支付→已支付→已发货→已完成）
                6. 数据兼容：历史数据如何处理？新旧版本如何兼容？

                请用结构化的方式输出，每个分支都要给出具体的处理规则。
          selected: false
          title: 问题拆解
          type: llm
          prompt_config:
            jinja2_variables: []
          reasoning_format: tagged
          version: '1'
          vision:
            enabled: false
        height: 98
        id: llm_decompose
        position:
          x: 300
          y: 0
        positionAbsolute:
          x: 300
          y: 0
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          context:
            enabled: false
            variable_selector: []
          desc: ''
          memory: null
          model:
            completion_params:
              max_tokens: 4096
              temperature: 0.3
            mode: chat
            name: qwen-plus
            provider: tongyi
          prompt_template:
            - role: user
              text: |
                你是一位资深B端产品经理，擅长发现需求中的遗漏和边界问题。

                【透传规则】如果下面的"需求结构"以"⚠️ 输入信息模糊"开头，说明输入信息不足，请原样输出这段澄清提示（一字不差），不要生成任何其他内容。

                【抗幻觉铁律】
                1. 只能使用用户输入中明确出现的信息，严禁编造、推测或脑补。
                2. 禁止凭空生成任何具体数据（数字、百分比、金额、成本、竞品名称等）。
                3. 输入中未提供的细节一律标【待补充】，不得伪造数值。

                以下是已经拆解好的需求结构：
                {{#llm_decompose.text#}}

                原始需求信息：
                - 功能名称：{{#start.feature_name#}}
                - 用户场景：{{#start.user_scenario#}}
                - 核心痛点：{{#start.core_pain_point#}}
                - MVP范围：{{#start.mvp_scope#}}
                - 非功能要求：{{#start.non_functional_requirements#}}

                请检查以上拆解是否遗漏了以下边界条件，如有遗漏请补充：
                - 空状态处理（列表为空、搜索无结果等）
                - 并发场景（多人同时操作同一数据）
                - 权限越级（用户尝试访问无权限的数据）
                - 历史数据兼容（旧版本数据在新功能下的表现）
                - 极端输入（超长文本、特殊字符、负数等）
                - 网络异常（超时、断网、重试）
                - 数据一致性（部分操作成功部分失败的回滚策略）

                请输出补全后的完整需求拆解文档。
          selected: false
          title: 边界补全
          type: llm
          prompt_config:
            jinja2_variables: []
          reasoning_format: tagged
          version: '1'
          vision:
            enabled: false
        height: 98
        id: llm_boundary
        position:
          x: 600
          y: 0
        positionAbsolute:
          x: 600
          y: 0
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          context:
            enabled: false
            variable_selector: []
          desc: ''
          memory: null
          model:
            completion_params:
              max_tokens: 8192
              temperature: 0.4
            mode: chat
            name: qwen-plus
            provider: tongyi
          prompt_template:
            - role: user
              text: |
                你是一位资深B端产品经理。请根据以下完整的需求拆解文档，严格按照给定的企业 PRD 模板结构，生成一份结构完整、内容充实的 PRD 文档（Markdown 格式）。

                【透传规则】如果下面的"需求拆解文档"以"⚠️ 输入信息模糊"开头，说明输入信息不足，请原样输出这段澄清提示（一字不差），不要生成任何其他内容。

                【抗幻觉铁律（最高优先级，违反即失败）】
                1. 只能使用输入中明确出现的信息，严禁任何形式的编造、推测或脑补。
                2. 禁止凭空生成任何具体数据：数字、百分比、金额、成本、预算、价格、用户量、市场份额、竞品名称、完成率、评分等。
                3. 输入中未提供的细节一律标【待补充】，绝不用"合理估计""约""大致"等方式伪造数值。
                4. 不得引用不存在的调研结论、行业报告或统计数据。

                【需求拆解文档】
                {{#llm_boundary.text#}}

                【原始需求信息】
                - 功能名称：{{#start.feature_name#}}
                - 用户场景：{{#start.user_scenario#}}
                - 核心痛点：{{#start.core_pain_point#}}
                - MVP范围：{{#start.mvp_scope#}}
                - 非功能要求：{{#start.non_functional_requirements#}}

                请严格按照以下章节结构输出。只填写输入中已知的内容，输入中缺失的信息一律标【待补充】，严禁编造：

                # 产品需求文档

                # 前言
                （用一段话概述本文档目的、适用范围与阅读对象，突出核心价值）

                # 一、版本信息
                | 项目 | 内容 |
                | --- | --- |
                | 版本号 | V1.0 |
                | 创建日期 | 填写当前日期 |
                | 审核人 | 待填写 |

                # 二、变更日志
                | 时间 | 版本号 | 变更人 | 主要变更内容 |
                | --- | --- | --- | --- |
                | | V1.0 | | 初始版本 |

                # 三、文档说明
                ## 名词解释
                | 术语 / 缩略词 | 说明 |
                | --- | --- |
                | （核心术语） | （术语解释） |

                # 四、需求背景
                ## 产品 / 数据现状
                （说明当前产品形态、数据现状及存在的问题）
                ## 用户调研
                （结合用户场景与核心痛点说明调研结论）
                ## 竞品分析
                （若用户输入未提供竞品信息，直接标【待补充】，严禁虚构竞品名称或数据）
                | 主要信息 | 关键结论 | 截图或视频 |
                | --- | --- | --- |
                | 【待补充】 | | |

                # 五、需求范围
                （条理性罗列 MVP 范围内与范围外的功能点）

                # 六、功能详细说明
                ## 产品流程图
                （用文字或 Mermaid 流程图描述核心流程）
                ## 交互原型图
                （用文字描述关键页面与交互）
                ## 功能说明
                | 序号 | 模块 | 功能 | 功能详细说明 | 交互图 |
                | --- | --- | --- | --- | --- |
                | 1 | | | | |

                # 七、非功能需求
                （性能、安全、兼容性、可用性等要求）

                # 八、埋点
                | 参数名 | 参数说明 | 参数值 |
                | --- | --- | --- |
                | | | |

                # 九、项目规划
                （里程碑与排期建议）

                # 附录
                - 数据分析报告：此处插入数据分析报告
                - 用户调研报告：此处插入用户调研报告
                - 设计分析报告：此处插入设计分析报告

                生成要求：
                1. 严格保留上述所有一级章节（#）与二级章节（##）标题，不得遗漏或改名
                2. 所有表格必须使用 Markdown 表格语法
                3. 每个章节只写输入中已知的内容，未知或未提供的项一律标【待补充】，严禁编造数值或事实
                4. 验收标准必须可量化
                5. 术语全文统一
                6. 明确标注 MVP 范围内和范围外的功能
                7. 功能说明表格需至少覆盖主流程、分支流程、异常场景三类功能点
          selected: false
          title: PRD生成
          type: llm
          prompt_config:
            jinja2_variables: []
          reasoning_format: tagged
          version: '1'
          vision:
            enabled: false
        height: 98
        id: llm_prd_generate
        position:
          x: 900
          y: 0
        positionAbsolute:
          x: 900
          y: 0
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          context:
            enabled: false
            variable_selector: []
          desc: ''
          memory: null
          model:
            completion_params:
              max_tokens: 8192
              temperature: 0.2
            mode: chat
            name: deepseek-chat
            provider: deepseek
          prompt_template:
            - role: user
              text: |
                【透传规则】如果下面的"PRD内容"以"⚠️ 输入信息模糊"开头，说明输入信息不足，请原样输出这段澄清提示（一字不差），不要生成任何其他内容。

                【抗幻觉铁律】自检与修正时也必须遵守：不得编造任何数据、数字、百分比、金额、竞品名称等。

                请对照以下自检清单，逐项检查这份PRD的完整性：

                □ 背景与目标是否清晰？
                □ 用户角色和权限是否完整定义？
                □ 主流程是否有完整的步骤描述？
                □ 异常场景是否覆盖（空状态/错误状态/边界值）？
                □ 状态流转是否闭环（每个状态都有进入和退出条件）？
                □ 非功能需求是否明确（性能/安全/兼容性）？
                □ 验收标准是否可量化？
                □ 是否存在编造的数据、数字、竞品名称等（幻觉）？
                □ 术语是否全文统一？
                □ 是否有遗漏的关联模块影响？

                PRD内容：
                {{#llm_prd_generate.text#}}

                请输出：
                1. 通过的检查项（打勾）
                2. 未通过的检查项 + 具体修改建议
                3. 整体质量评分（1-10分）
                4. 如果有未通过项，请同时输出一份修正后的完整PRD
          selected: false
          title: 自检校对
          type: llm
          prompt_config:
            jinja2_variables: []
          reasoning_format: tagged
          version: '1'
          vision:
            enabled: false
        height: 98
        id: llm_self_check
        position:
          x: 1200
          y: 0
        positionAbsolute:
          x: 1200
          y: 0
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          context:
            enabled: false
            variable_selector: []
          desc: ''
          memory: null
          model:
            completion_params:
              max_tokens: 8192
              temperature: 0.3
            mode: chat
            name: qwen-plus
            provider: tongyi
          prompt_template:
            - role: user
              text: |
                你是一位资深B端产品经理。以下是 AI 生成的 PRD 初稿和自检结果。

                【透传规则】如果下面的"PRD 初稿"以"⚠️ 输入信息模糊"开头，说明输入信息不足，请原样输出这段澄清提示（一字不差），不要生成任何其他内容。

                【抗幻觉铁律（最高优先级）】
                1. 只能保留输入中明确出现的信息，删除或修正一切编造内容。
                2. 禁止出现任何输入中没有的数据：数字、百分比、金额、成本、预算、竞品名称、完成率、评分等；凡无依据的数值一律改为【待补充】。
                3. 不得引用不存在的调研结论或行业报告。

                【PRD 初稿】
                {{#llm_prd_generate.text#}}

                【自检结果】
                {{#llm_self_check.text#}}

                请完成以下任务：
                1. 根据自检结果中的修改建议，修正 PRD 初稿中存在的问题，并重点删除所有编造的数据、数字、百分比、竞品名称、预算等幻觉内容（无依据的数值一律改为【待补充】）
                2. 保持与初稿一致的 PRD 模板章节结构（前言、版本信息、变更日志、文档说明、需求背景、需求范围、功能详细说明、非功能需求、埋点、项目规划、附录）
                3. 在"二、变更日志"章节中，如实记录本次从初稿到终稿的所有修改点（时间、版本号、变更人、主要变更内容）

                最终只输出修正后的完整 PRD 终稿（Markdown 格式），不要输出任何解释性说明文字。
          selected: false
          title: 终稿输出
          type: llm
          prompt_config:
            jinja2_variables: []
          reasoning_format: tagged
          version: '1'
          vision:
            enabled: false
        height: 98
        id: llm_final
        position:
          x: 1500
          y: 0
        positionAbsolute:
          x: 1500
          y: 0
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          desc: ''
          provider_id: prd/text-to-file/text_to_file
          provider_name: text_to_file
          provider_type: builtin
          selected: false
          title: 文本转文件
          tool_configurations:
            filename:
              type: constant
              value: PRD.md
          tool_label: 文本转文件
          tool_name: text_to_file
          tool_node_version: '2'
          tool_parameters:
            text:
              type: variable
              value:
                - llm_final
                - text
          type: tool
        height: 98
        id: tool_text_to_file
        position:
          x: 1680
          y: 0
        positionAbsolute:
          x: 1680
          y: 0
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          desc: ''
          outputs:
            - value_selector:
                - llm_final
                - text
              value_type: string
              variable: final_prd
            - value_selector:
                - tool_text_to_file
