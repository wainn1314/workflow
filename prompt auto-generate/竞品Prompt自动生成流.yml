app:
  description: 根据产品名称与功能描述，自动匹配 Prompt 模版，生成可直接交给 AI 编程工具（vibe coding）使用的产品开发 Prompt。
  icon: 📝
  icon_background: '#E4FBCC'
  icon_type: emoji
  mode: advanced-chat
  name: 竞品Prompt自动生成流
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/tongyi:0.2.16@6a3bfd05067f9a146457e882847673b53cc6681707a172f800ceed4070b231a7
    version: null
kind: app
version: 0.7.0
workflow:
