  features:
    file_upload:
      allowed_file_extensions:
      - .md
      - .txt
      - .pdf
      - .docx
      allowed_file_types:
      - document
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: true
      fileUploadConfig:
        attachment_image_file_size_limit: 2
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        file_upload_limit: 50
        image_file_batch_limit: 10
        image_file_size_limit: 10
        knowledge_file_size_limit: 15
        single_chunk_attachment_limit: 10
        skill_file_size_limit: 50
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: 你好！请上传 PRD 文档（.md/.txt/.pdf/.docx），或直接发送「产品名称 + 功能描述」。我会先对 PRD 进行清洗与摘要，再匹配 Prompt 模版，为你生成一份可直接交给 AI 编程工具（vibe coding）使用的产品开发 Prompt。你可以继续补充技术规格、Dify 版本、大模型、交付物格式或新增功能（例如「结束聊天时选颜色→生成情绪胶囊→保存→列表展示」），我会把它们融入 Prompt，而不是直接生成 YML/Chatflow 配置。满意后回复「可以了」结束。
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
    - 竞品：某某智能客服，支持多轮 FAQ 自动回复与工单转接
    - 竞品：某某营销助手，擅长小红书种草文案与活动话术
    - 语气再专业一点，并加一条价格相关约束
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
