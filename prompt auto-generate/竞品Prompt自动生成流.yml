    - data:
        context:
          enabled: false
          variable_selector: []
        desc: 对 PRD 原文进行清洗与摘要，提炼竞品核心信息，降低下游 Token 消耗
        memory:
          query_prompt_template: '{{#sys.query#}}'
          role_prefix:
            assistant: ''
            user: ''
          window:
            enabled: false
            size: 10
        model:
          completion_params:
            temperature: 0.1
          mode: chat
          name: qwen-max
          provider: langgenius/tongyi/tongyi
        prompt_template:
        - id: 4d5e6f7a-0001-4c9d-0e1f-2a3b4c5d6e7f
          role: system
          text: |
            # Role
            你是一名资深的 PRD（产品需求文档）清洗与摘要专家。你的任务是从用户上传的 PRD 文档中，精准提炼竞品的核心信息，去除版本历史、目录、流程图描述、重复内容等噪声，输出一份高度浓缩的摘要，以降低下游模型的 Token 消耗。

            # 提炼要求
            1. 只保留对「理解该竞品并生成产品开发 Prompt」有价值的信息
            2. 忠实原文，不臆造、不遗漏关键功能与约束
            3. 每条信息尽量精简，整体控制在 500 字以内
            4. 若原始文本为空或无法识别，直接输出「（无 PRD 内容）」

            # 输出格式
            请严格按以下 Markdown 列表结构输出（不要输出代码块或其他废话）：
            - 产品名称：xxx
            - 一句话定位：xxx
            - 目标用户：xxx
            - 用户需求/痛点：xxx
            - 核心功能（去重后逐条列出）：
              1. xxx
              2. xxx
            - 关键使用场景：xxx
            - 技术规格与交付要求（如 Dify 版本、可用大模型 deepseek/qwen、交付物为可导入 Dify 的 YML、用 Chatflow 实现等）：xxx
            - 其他约束（合规/性能/风格等）：xxx
        - id: 5e6f7a8b-0002-4c9d-0e1f-2a3b4c5d6e7f
          role: user
          text: "【PRD 原始文本】\n{{#2b3c4d5e-6f7a-4b8c-9d0e-1f2a3b4c5d6e.text#}}"
        selected: false
        title: PRD清洗摘要
        type: llm
        variables: []
